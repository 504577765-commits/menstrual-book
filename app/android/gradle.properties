org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 构建健壮性：默认的 HTTP 超时在依赖源不可达时会让构建长时间无响应。
# 显式设置超时可让问题快速暴露，而不是"看起来卡死"。
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000

# 禁止 AGP 自动下载 SDK 部件：compileSdk=37 对应平台已本地提供（platforms/android-37），
# 避免构建时 sdkmanager 自动重装官方 platforms;android-37.0 覆盖本地转换的目录。
android.builder.sdkDownload=false
android.suppressUnsupportedCompileSdk=37.0
